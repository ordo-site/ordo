<style id="ordo-28">
/* Ordo · iOS design layer (единый стиль, заменяет все прежние слои CSS) */
:root{
  color-scheme:dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --bg:#000;--card:#111113;--card-2:#1c1c1f;--sheet:#1c1c1e;
  --fill:rgba(120,120,128,.20);--fill-2:rgba(120,120,128,.34);
  --hair:rgba(255,255,255,.12);--sep:rgba(255,255,255,.09);
  --text:#fff;--muted:rgba(235,235,245,.60);--faint:rgba(235,235,245,.34);
  --accent:#0a84ff;--on-accent:#fff;--good:#32d74b;--warn:#ffd60a;--bad:#ff453a;
  --glass:rgba(24,24,27,.60);--glass-strong:rgba(34,34,38,.82);--glass-line:rgba(255,255,255,.14);
  --scrim:rgba(0,0,0,.52);
  --shadow:0 1px 1px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.5);
  --shadow-pill:0 14px 44px rgba(0,0,0,.6),0 2px 10px rgba(0,0,0,.45);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body.light{
  color-scheme:light;
  --bg:#fff;--card:#fff;--card-2:#f5f5f7;--sheet:#fff;
  --fill:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.20);
  --hair:rgba(0,0,0,.09);--sep:rgba(0,0,0,.08);
  --text:#000;--muted:rgba(60,60,67,.62);--faint:rgba(60,60,67,.32);
  --accent:#007aff;--good:#1f8a3b;--warn:#a05a00;--bad:#d70015;
  --glass:rgba(255,255,255,.68);--glass-strong:rgba(255,255,255,.88);--glass-line:rgba(0,0,0,.08);
  --scrim:rgba(0,0,0,.28);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(0,0,0,.07);
  --shadow-pill:0 12px 36px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
}

/* ---------- Основа ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000;color-scheme:dark;-webkit-text-size-adjust:100%}
html:has(body.light){background:#fff;color-scheme:light}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.47 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;transition:background-color .3s ease,color .3s ease}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.app-loading{pointer-events:none}
.tab-screen{transition:opacity .18s ease}
.app-loading .tab-screen{opacity:.55}
.muted{color:var(--muted)}
.dangerText{color:var(--bad)}
.goodText{color:var(--good)}

/* ---------- Каркас ---------- */
.app{position:relative;min-height:100dvh;padding:calc(60px + var(--safe-t)) 0 0}
.tab-screen{max-width:880px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right)) calc(128px + var(--safe-b)) max(16px,env(safe-area-inset-left))}

/* ---------- Шапка (матовое стекло, всегда в одну строку) ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;min-height:calc(60px + var(--safe-t));padding:var(--safe-t) max(14px,calc((100% - 880px)/2)) 0;isolation:isolate;background:none}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--sep);-webkit-transform:translateZ(0);transform:translateZ(0)}
.brand-button{flex:1 1 auto;min-width:0;min-height:44px;display:flex;align-items:center;gap:10px;margin:0;padding:0;border:0;background:none;color:inherit;text-align:left;transition:transform .2s var(--ease)}
.mark{flex:0 0 auto;width:40px;height:40px;display:block;overflow:visible}
.mark .lg-a{stroke:var(--text)}
.mark .lg-b{fill:var(--accent)}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand strong{font-size:18px;font-weight:700;letter-spacing:-.025em}
.brand small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:500}
.top .row{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.icon-btn{flex:0 0 auto;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text);font-size:20px;line-height:1;transition:transform .2s var(--ease),background .2s ease}
.icon-btn:hover{background:var(--fill)}
.theme-toggle{font-size:23px}
.ico{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag .ico{width:16px;height:16px}
.btn.theme-toggle .ico{margin:0 auto}
.bottom-fade{position:fixed;left:0;right:0;bottom:0;z-index:35;height:calc(118px + var(--safe-b));pointer-events:none;background:linear-gradient(to top,var(--bg) 0%,transparent 100%);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to top,#000 40%,transparent 100%);mask-image:linear-gradient(to top,#000 40%,transparent 100%);-webkit-transform:translateZ(0);transform:translateZ(0)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.user-chip{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--fill);color:var(--text);font-size:14px;font-weight:600}
.user-name{display:block;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Нажатия: единое сжатие 0.96 ---------- */
.brand-button:active,.icon-btn:active,.btn:active,.nav:active,.status-btn:active,.admin-group:active{transform:scale(.96)}

/* ---------- Нижняя плавающая «пилюля» ---------- */

.tap{cursor:pointer}
.qgrip{touch-action:none;cursor:grab;min-width:44px;min-height:36px;padding:0 14px;justify-content:center}
.status-segment{position:relative;gap:0}

.btn{position:relative}

.btn.primary.is-busy::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes ordoSpin{to{transform:rotate(360deg)}}
.auth-mark{display:block;width:56px;height:56px;margin:0 0 10px}

(() => {
  const C=window.Ordo.Core; const {app,$,esc,fmt,initials,roleName}=C; const {currentQueue,debtorIds,isLeader,isStaff,startBtn}=window.Ordo.State;
    const plural=(n,a,b,c)=>{const m=n%100,d=n%10;return(m>10&&m<20)?c:d===1?a:(d>1&&d<5)?b:c};
  function heroHtml(){const q=currentQueue(),now=app.state.current||null,me=app.people.find(p=>p.user_id===app.user.id),i=me?q.findIndex(p=>p.id===me.id):-1,g=esc(app.group.name);

    else if(i>=2){const n=Math.floor(i/2);t='Ты №'+(i+1);s='Примерно через '+n+' '+plural(n,'дежурство','дежурства','дежурств')}

  function renderHome() {
    const q = currentQueue();
    const now = app.state.current || null;
    const next = q.slice(0, 2);
    const me = app.people.find(p => p.user_id === app.user.id);
    const myIndex = me ? q.findIndex(p => p.id === me.id) : -1;
    const debtorSet = new Set(debtorIds());
    const debtors = [...debtorSet].map(id => app.people.find(p => p.id === id)?.name).filter(Boolean);

    return `
      ${installBanner()}
      ${heroHtml()}

      <div class="grid">
        <article class="card half${now ? ' is-live' : ''}">\n          <div class="eyebrow">Сейчас</div>

          ${
            now
              ? `
                <div class="now">
                  <div>
                    <div class="names">${esc((now.names || []).join(' + '))}</div>

                  </div>

                  ${
                    isLeader()

  function renderAdmin() {
    return `
      <section class="hero admin-center compact">
        <div class="eyebrow">${app.profile?.role==='admin'?'Администратор':'Старший староста'}</div>
        <h1>Управление</h1>
      </section>

      <div class="grid">
        <article class="card half">
          <div class="row">
            <div>
              <h2>Группы колледжа</h2>
              <div class="sub">У каждой группы своя очередь и свой журнал. Нажми на группу, чтобы управлять ею.</div>
            </div>
            ${app.profile?.role==='admin'?'<button class="btn primary" id="createGroup">Создать</button>':''}
          </div>
          <div id="adminGroups" class="admin-group-list" style="margin-top:12px">
            <div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </article>

        <article class="card half">
          <div class="row">
            <div>
              <h2>${app.profile?.role==='admin'?'Система':'Группа'}</h2><div class="sub">${app.profile?.role==='admin'?'Supabase · облачное хранение':'Назначения и экспорт'}</div>
            </div>
            <button class="btn" id="refresh">Обновить</button>
          </div>
          <div class="metric"><span>Активная группа</span><b>${esc(app.group?.name || '—')}</b></div>
          <div class="metric"><span>Участников</span><b>${app.people.length}</b></div>
          <div class="metric"><span>Событий</span><b>${(app.state.log || []).length}</b></div>
          <div class="actions">
            <button class="btn" id="adminExport">Экспорт данных (Excel)</button><button class="btn" id="pauseBtn">${app.group?.settings?.paused?'Возобновить назначения':'Приостановить назначения'}</button>
          </div>
        </article>

        <article class="card">
          <h2>Аккаунты</h2>
          <div class="sub">Логин и пароль для тех, у кого ещё нет аккаунта. Пароль показывается один раз, при первом входе человек задаёт свой.</div>
          <div class="actions" style="margin-top:12px"><button class="btn primary" id="makeAccounts">Создать аккаунты</button></div>
          <div class="list" style="margin-top:10px">
            ${app.people.filter(p => p.user_id).map(p => `
              <div class="line"><div class="row"><b>${esc(p.name)}</b><button class="btn" data-reset="${esc(p.id)}">Сбросить пароль</button></div></div>
            `).join('')}
          </div>
        </article>

        ${fold('users','Пользователи и роли','Выдай или сними права старосты в активной группе.',`<div id="adminUsers" class="list"><div class="skeleton"></div><div class="skeleton"></div></div>`)}
        ${app.profile?.role==='head'?`<article class="card"><h2>Запросы старост</h2><div class="sub">Удаление и добавление участников в этой группе.</div><div id="rmReqs" class="list" style="margin-top:10px"><div class="skeleton"></div></div></article>`:''}
        ${app.profile?.role==='admin'?fold('ver','Откат','Сохранённые версии очереди и истории этой группы.',`<div id="verList" class="list"><div class="skeleton"></div></div>`):''}
        ${fold('audit','Действия','Последние события группы с авторами.',`<div id="auditFeed" class="list"><div class="skeleton"></div></div>`)}
        ${app.profile?.role==='admin'?fold('donors','Донатеры','Топ поддержавших проект.',`<div class="actions"><button class="btn primary" data-donor-add="1">Добавить</button></div><div id="donorAdmin" class="list" style="margin-top:10px"><div class="skeleton"></div></div>`):''}
        ${app.profile?.role==='admin'?fold('data','Данные','Бэкап и очистка. Очистка необратима.',`<div class="actions"><button class="btn" id="adminExport2">Скачать бэкап (Excel)</button></div><div id="bkNote" class="notice warn hidden" style="margin-top:10px">Бэкап давно не делали, скачайте его.</div><div class="actions"><button class="btn danger" data-purge="removed">Очистить удалённых</button><button class="btn danger" data-purge="all">Сбросить группу</button></div><p class="tiny">«Очистить удалённых» стирает убранных людей и их аккаунты. «Сбросить группу» стирает всех, кроме админа и старшего старосты, а также очередь и историю.</p>`):''}
      </div>
    `;
  }

  function logDate(at){const m=String(at||'').match(/^(\d{1,2})\.(\d{2})\.(\d{4})[,\s]+(\d{1,2}):(\d{2})/);const d=m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]):new Date(at);return d&&!isNaN(d)?d:null}
  function logKind(a){a=String(a||'');if(a.startsWith('НЕ засчитано'))return 'skip';if(a.startsWith('Засчитано')||a.startsWith('Начато'))return 'duty';if(a.startsWith('Очередь'))return 'queue';return 'other'}
  function dayLabel(d){if(!d)return 'Без даты';const t=new Date(),y=new Date();y.setDate(t.getDate()-1);if(d.toDateString()===t.toDateString())return 'Сегодня';if(d.toDateString()===y.toDateString())return 'Вчера';return d.toLocaleDateString('ru-RU',d.getFullYear()===t.getFullYear()?{day:'numeric',month:'long'}:{day:'numeric',month:'long',year:'numeric'})}
  function historyCard(){
    const f=app.histFilter||'all';
    const FILTERS=[['all','Все'],['duty','Дежурства'],['skip','Пропуски'],['queue','Очередь']];
    const rows=(app.state.log||[]).map((x,ix)=>({x,ix,d:logDate(x.at),k:logKind(x.action)})).filter(r=>f==='all'||r.k===f).reverse().slice(0,100);
    let html='',last='';
    rows.forEach(({x,ix,d,k})=>{
      const lab=dayLabel(d);if(lab!==last){html+=`<div class="h-day">${esc(lab)}</div>`;last=lab}

(() => { const C=window.Ordo.Core; const {app,db,root,$,esc,toast,run}=C; const {currentQueue,isLeader,saveState,audit,debtorIds,loadGroup}=window.Ordo.State; const STATUS=window.Ordo.STATUS;
  async function startDuty() {
    if (app.state.current) return toast('Дежурство уже идёт');
    const q = currentQueue();
    if (!q.length) return toast('Очередь пуста');
    const ds = new Set(debtorIds());
    const pos = id => { const i = (app.state.queue || []).indexOf(id); return i < 0 ? 1e9 : i; };
    const D = q.filter(p => ds.has(p.id)).sort((a, b) => pos(a.id) - pos(b.id));
    const R = q.filter(p => !ds.has(p.id));
    const pair = D.length ? (R.length ? [D[0], R[0]] : D.slice(0, 2)) : R.slice(0, 2);
    const inPair = new Set(pair.map(p => p.id));
    const optHtml = q.filter(p => !inPair.has(p.id)).map(p => `<option value="${esc(p.id)}">${esc(p.name)}${ds.has(p.id) ? ' · должник' : ''}</option>`).join('');
    const slots = pair.map((p, i) => `<div class="field"><label>${esc(p.name)} <span class="tag ${ds.has(p.id) ? 'dangerText' : ''}">${ds.has(p.id) ? 'должник' : 'по очереди'}</span></label><select class="input" data-slot="${esc(p.id)}"><option value="">Дежурит сам(а)</option>${i === 1 ? '<option value="__none">Не назначать, дежурит один</option>' : ''}${optHtml ? `<optgroup label="Вместо него дежурит">${optHtml}</optgroup>` : ''}</select></div>`).join('');
    const warn = window.Ordo.State.dutyWindowOpen() ? '' : '<div class="notice warn" style="margin-top:12px">Вне расписания (будни 8:00–16:30). Вам можно, действие попадёт в журнал событий.</div>';
    root.insertAdjacentHTML('beforeend', `<div class="modal" id="startModal"><div class="modalbox"><h3>Начать дежурство</h3><div class="stack">${slots}</div><p class="tiny">В паре не больше одного должника. Если кто-то дежурит за другого, тот не получает долг и уходит в конец очереди.</p>${warn}<div class="actions"><button class="btn ghost" id="stNo">Отмена</button><button class="btn primary" id="stYes">Начать</button></div></div></div>`);
    const m = $('#startModal');
    $('#stNo').onclick = () => m.remove();
    $('#stYes').onclick = () => run(async () => {
      const turn = [], duty = [], forIds = {}, used = new Set();
      for (const p of pair) {
        const v = m.querySelector(`[data-slot="${p.id}"]`).value;
        if (v === '__none') continue;
        const who = v || p.id;
        if (used.has(who)) { toast('Один человек выбран дважды'); return; }
        used.add(who); turn.push(p.id); duty.push(who);
        if (v) forIds[v] = p.id;
      }
      if (!duty.length) { toast('Некого назначать'); return; }
      const nm = id => app.people.find(p => p.id === id)?.name || '?';
      const label = id => nm(id) + (forIds[id] ? ' (за ' + nm(forIds[id]) + ')' : '');
      const now = new Date().toISOString();
      app.state.current = { ids: duty, mainIds: duty, names: duty.map(nm), startedAt: now, forIds };
      app.state.queue = q.filter(x => !turn.includes(x.id)).map(x => x.id).concat(turn);
      app.state.log = app.state.log || [];
      app.state.log.push({ at: now, action: 'Начато: ' + duty.map(label).join(' + ') });
      m.remove();
      await saveState();
      await audit('duty_started', { people: duty });
      window.Ordo.Main.render();
      toast('Дежурство начато');
    });
  }

  async function finishDuty() {
    const c = app.state.current;

    if (!c) {
      return;
    }

    const nm = id => app.people.find(p => p.id === id)?.name || '?';
    const marks = {};
    const debtorSet = new Set(window.Ordo.State.debtorIds());

    root.insertAdjacentHTML(
      'beforeend',
      `
        <div class="modal" id="finModal">
          <div class="modalbox">
            <h3>Кто отдежурил?</h3>

            <div class="stack">
              ${
                c.ids.map(id => `
                  <div class="field">
                    <label>
                      ${esc(nm(id))}${c.forIds && c.forIds[id] ? ' · за ' + esc(nm(c.forIds[id])) : ''}
                      ${debtorSet.has(id) ? ' · должник' : ''}
                    </label>

                    <div class="status-segment" data-person="${esc(id)}"><i class="seg-thumb" aria-hidden="true"></i>
                      <button
                        type="button"
                        class="status-btn present" role="radio" aria-pressed="false"
                        data-m="${esc(id)}|${STATUS.PRESENT}"
                      >Был</button>

                      <button
                        type="button"
                        class="status-btn absent" role="radio" aria-pressed="false"
                        data-m="${esc(id)}|${STATUS.ABSENT}"
                      >Не было</button>

                      <button
                        type="button"
                        class="status-btn escaped" role="radio" aria-pressed="false"
                        data-m="${esc(id)}|${STATUS.ESCAPED}"
                      >Сбежал</button>
                    </div>
                  </div>
                `).join('')
              }
            </div>

            <p class="tiny">
              Не отдежуривший становится должником. В каждой паре не больше одного должника, остальных очередь не ждёт.
            </p>

            <div class="field" style="margin-top:14px">
              <label for="dutyComment">Комментарий</label>
              <textarea
                id="dutyComment"
                class="input"
                rows="3"
                placeholder="Например: Алекс подменил отсутствующего"
              ></textarea>
            </div>

            <div class="actions">
              <button class="btn ghost" id="finCancel">Отмена</button>
              <button class="btn primary" id="finOk" disabled>Записать</button>
            </div>
          </div>
        </div>
      `
    );

    const m = $('#finModal');
    const ok = $('#finOk');

    m.querySelectorAll('[data-m]').forEach(button => {
      button.onclick = () => {
        const [id, status] = button.dataset.m.split('|');

        marks[id] = status;
        { const seg = button.closest('.status-segment'); seg.dataset.s = status; seg.style.setProperty('--i', ['present','absent','escaped'].indexOf(status)); }

        m.querySelectorAll(`[data-m^="${id}|"]`).forEach(item => item.setAttribute('aria-pressed', item === button ? 'true' : 'false'));

        m
          .querySelectorAll(`[data-m^="${id}|"]`)
          .forEach(item => {
            item.classList.toggle('selected', item === button);
          });

        ok.disabled = c.ids.some(id => !marks[id]);
      };
    });

    $('#finCancel').onclick = () => m.remove();
    m.querySelectorAll('[data-m$="|present"]').forEach(b => b.click());

    ok.onclick = () =>
      run(async () => {
        const main = c.mainIds || c.ids.slice(0, 2);
        const counted = main.some(id => marks[id] === STATUS.PRESENT);
        const now = new Date().toISOString();
        const comment = $('#dutyComment')?.value.trim() || '';

        const words = {
          [STATUS.PRESENT]: 'был(а)',
          [STATUS.ABSENT]: 'не было',
          [STATUS.ESCAPED]: 'сбежал(а)'
        };

        delete app.state.priority;
        delete app.state.debts;

        const logEntry = {
          at: now,
          counted,
          action:
            (counted ? 'Засчитано: ' : 'НЕ засчитано: ') +
            c.ids
              .map(id => `${nm(id)}${c.forIds && c.forIds[id] ? ' (за ' + nm(c.forIds[id]) + ')' : ''} — ${words[marks[id]]}`)
              .join('; '),
          people: c.ids.flatMap(id => { const r = [{ id, status: marks[id] }]; const f = c.forIds && c.forIds[id]; if (f) r.push({ id: f, status: marks[id], sub: true }); return r; }),
          comment
        };

        if (comment) {
          logEntry.action += ` · ${comment}`;
        }

        app.state.log = app.state.log || [];
        app.state.log.push(logEntry);

        app.state.current = null;

        await saveState();
        await audit('duty_finished', {
          counted,
          marks,
          comment
        });

        m.remove();
        window.Ordo.Main.render();

        toast(
          counted
            ? 'Дежурство записано'
            : 'Не засчитано: пара останется первой'
        );
      });
  }

  async function move(id, dir) {
    const q = currentQueue();
    const i = q.findIndex(x => x.id === id);
    const j = i + dir;

    if (i < 0 || j < 0 || j >= q.length) {
      return;
    }

    [q[i], q[j]] = [q[j], q[i]];

    app.state.queue = q.map(x => x.id);
    app.state.log = app.state.log || [];

    app.state.log.push({
      action: 'Очередь изменена',
      at: new Date().toLocaleString('ru-RU')
    });

    await saveState();
    await audit('queue_changed', {
      person: id,
      dir
    });

    window.Ordo.Main.render();
  }
window.Ordo.Duty={startDuty,finishDuty,move};
})();

(() => { const C=window.Ordo.Core; const {app,db,root,$,esc,fmt,toast,fail,run}=C; const {loadGroup,subscribeToGroupUpdates,audit}=window.Ordo.State;
  async function loadCollegeGroups() {
    const result = await db
      .from('groups')
      .select('*')
      .eq('college_id', app.profile.college_id)
      .order('created_at');

    if (result.error) {
      throw result.error;
    }

    return result.data || [];
  }

  async function switchAdminGroup(groupId) {
    if (!['admin','head'].includes(app.profile?.role)) {
      return;
    }

    const groups = await loadCollegeGroups();
    const group = groups.find(item => item.id === groupId);

    if (!group) {
      throw new Error('Группа не найдена.');
    }

    app.group = group;
    app.membership = {
      group_id: group.id,
      role: 'leader'
    };
    localStorage.setItem('dutysite-active-group', group.id);

    await loadGroup();
    await subscribeToGroupUpdates();
    window.Ordo.Main.render();
    toast(`Открыта группа: ${group.name}`);
  }

  async function createGroup() {
    return window.Ordo.UI.askText('Название новой группы','Создать',async name=>{try{await createGroupWithName(name)}catch(e){fail(e)}});
  }

  async function createGroupWithName(name) {

    if (!name?.trim()) return;

    const result = await db
      .from('groups')
      .insert({
        college_id: app.profile.college_id,
        name: name.trim()
      })
      .select()
      .single();

    if (result.error) {
      throw result.error;
    }

    const stateResult = await db
      .from('group_state')
      .insert({
        group_id: result.data.id,
        state: {
          queue: [],
          log: [],
          current: null
        },
        updated_by: app.user.id
      });

    if (stateResult.error) {
      throw stateResult.error;
    }

    const codeResult = await db.rpc('ensure_group_join_code', {
      p_group_id: result.data.id
    });

    if (codeResult.error) {
      throw codeResult.error;
    }

    await switchAdminGroup(result.data.id);
    toast(`Группа «${result.data.name}» создана`);
  }

  function loadAdminPanels() {
    [['#adminGroups', renderAdminGroups], ['#adminUsers', renderAdminUsers], ['#rmReqs', renderRemovals], ['#auditFeed', renderAudit], ['#verList', renderVersions], ['#donorAdmin', renderDonorsAdmin]].forEach(async ([sel, load]) => {
      try {
        await load();
      } catch (e) {
        const el = $(sel);
        if (el) el.innerHTML = `<div class="notice bad">Не удалось загрузить: ${esc(e.message || e)}</div>`;
      }
    });
  }

  async function renderAdminGroups() {
    const container = $('#adminGroups');

    if (!container) {
      return;
    }

    const groups = await loadCollegeGroups();

    container.innerHTML = groups.map(group => `
      <button class="admin-group" data-admin-group="${esc(group.id)}">
        <span>
          <b>${esc(group.name)}</b>
          <span class="sub" style="display:block">${group.id === app.group?.id ? 'активная' : 'открыть'}</span>
        </span>
        <span class="tag">${group.id === app.group?.id ? '✓' : '→'}</span>
      </button>
    `).join('') || '<div class="notice">Групп пока нет.</div>';

    container.querySelectorAll('[data-admin-group]').forEach(button => {
      button.onclick = () => run(() => switchAdminGroup(button.dataset.adminGroup));
    });
  }

  async function renderAdminUsers() {
    const container = $('#adminUsers');

    if (!container) {
      return;
    }

    const ids = app.people.map(p => p.user_id).filter(Boolean);
    if (!ids.length) { container.innerHTML = '<div class="notice">В группе пока нет подключённых аккаунтов.</div>'; return; }
    const profilesResult = await db
      .from('profiles')
      .select('id,display_name,role,college_id')
      .eq('college_id', app.profile.college_id)
      .in('id', ids)
      .order('display_name');

    if (profilesResult.error) {
      throw profilesResult.error;
    }

    const membershipsResult = await db
      .from('group_members')
      .select('user_id,group_id,role')
      .eq('group_id', app.group.id);

    if (membershipsResult.error) {
      throw membershipsResult.error;
    }

    const memberships = new Map(
      (membershipsResult.data || []).map(item => [item.user_id, item])
    );

    container.innerHTML = (profilesResult.data || []).map(profile => {
      const membership = memberships.get(profile.id);
      const leader = membership?.role === 'leader';
      const self = profile.id === app.user.id;

      return `
        <div class="admin-user">
          <div>
            <b>${esc(profile.display_name || 'Без имени')}</b>

          <button
            class="btn ${leader ? 'danger' : ''}"

          >
            ${leader ? 'Снять старосту' : 'Выдать старосту'}
          </button>
        </div>
      `;
    }).join('') || '<div class="notice">Пользователей пока нет.</div>';

    container.querySelectorAll('[data-promote-user]').forEach(button => {
      button.onclick = () => run(() => setLeaderRole(button.dataset.promoteUser, !button.dataset.leader));
    });
  }

  async function setLeaderRole(userId, makeLeader) {
    if (userId === app.user.id) {
      return;
    }

    const result = await db.rpc('set_group_role', { p_group_id: app.group.id, p_user_id: userId, p_leader: !!makeLeader });
    if (result.error) {
      throw result.error;
    }
    await renderAdminUsers();
    toast(makeLeader ? 'Права старосты выданы' : 'Права старосты сняты');
  }

  async function exportExcel() {

  async function refreshNotices(){try{if(!app.user)return;const me=app.people.find(p=>p.user_id===app.user.id);const r=await db.from('audit_log').select('created_at,payload').eq('action','password_reset').order('created_at',{ascending:false}).limit(20);if(r.error)return;app.myResets=(r.data||[]).filter(x=>me&&x.payload&&x.payload.person_id===me.id);let seen=0;try{seen=+localStorage.getItem('ordo-seen-notice')||0}catch(_){}app.unseenNotice=app.myResets.some(x=>+new Date(x.created_at)>seen)}catch(_){}syncDot()}
  const WHO=x=>x==='admin'?'администратором':x==='head'?'старшим старостой':'старостой группы';
  async function meTab(){const el=$('#inboxBody');await refreshNotices();const me=app.people.find(p=>p.user_id===app.user.id);const items=[];if(me){if((app.state.current?.ids||[]).includes(me.id))items.push(['Сейчас вы дежурите','Дежурство закончит староста']);try{const d=window.Ordo.State.debtorIds();if(d&&(d.has?d.has(me.id):d.includes(me.id)))items.push(['За вами долг','Ближайшая пара включит вас в дежурство'])}catch(_){}}(app.myResets||[]).forEach(x=>items.push(['Пароль сброшен '+WHO(x.payload&&x.payload.by_role),fmt(x.created_at)]));el.innerHTML=items.map(([t,sub])=>`<div class="line"><b>${esc(t)}</b><div class="sub">${esc(sub)}</div></div>`).join('')||'<div class="sub">Ничего нового</div>';try{localStorage.setItem('ordo-seen-notice',String(Date.now()))}catch(_){}app.unseenNotice=false;syncDot()}
  async function refreshPending(){if(role()!=='head')return;try{const r=await db.from('removal_requests').select('id',{count:'exact',head:true}).eq('status','pending');if(!r.error)app.pending=r.count||0}catch(_){}syncDot();if(!app.rqChan){try{app.rqChan=db.channel('ordo-rq').on('postgres_changes',{event:'*',schema:'public',table:'removal_requests'},()=>refreshPending()).subscribe()}catch(_){}}}
  function streaks(){const m=new Map();(app.state.log||[]).forEach(e=>(e.people||[]).forEach(p=>{if(p.sub)return;m.set(p.id,p.status==='present'?0:(m.get(p.id)||0)+1)}));return [...m].filter(([id,n])=>n>=3&&app.people.some(p=>p.id===id&&!p.data?.paused)).map(([id,n])=>({name:app.people.find(p=>p.id===id).name,n}))}
  async function mine(){const el=$('#inboxBody');const r=await db.from('removal_requests').select('id,kind,new_name,reason,status,created_at,people(name)').eq('requested_by',app.user.id).order('created_at',{ascending:false}).limit(20);if(r.error)throw r.error;el.innerHTML=(r.data||[]).map(x=>`<div class="line"><b>${x.kind==='add'?'Добавить: '+esc(x.new_name):'Убрать: '+esc(x.people?.name||'?')}</b><div class="sub">${esc(SW[x.status]||x.status)} · ${esc(fmt(x.created_at))}${x.reason?' · '+esc(x.reason):''}</div></div>`).join('')||'<div class="sub">Запросов пока нет</div>'}
  async function open(){const r=role(),leader=app.membership?.role==='leader';const tabs=r==='head'?[['req','Запросы'],['ev','События'],['me','Мне']]:r==='admin'?[['ev','События'],['me','Мне']]:leader?[['me','Мне'],['mine','Мои запросы']]:[['me','Мне']];if(document.getElementById('inbox'))return;
    root.insertAdjacentHTML('beforeend',`<div class="modal" id="inbox"><div class="modalbox sheet"><div class="sheet-head"><h3>Уведомления</h3><button type="button" class="btn ghost" id="inClose">Закрыть</button></div>${tabs.length>1?`<div class="seg" role="tablist" style="margin-bottom:12px">${tabs.map(([k,l],i)=>`<button type="button" role="tab" data-it="${k}" class="${i?'':'on'}" aria-selected="${i?'false':'true'}">${l}</button>`).join('')}</div>`:''}<div id="inboxBody" class="list"><div class="skeleton"></div></div></div></div>`);
    const m=$('#inbox');let changed=false,cur=tabs[0][0];
    const load=async k=>{cur=k;try{if(k==='req')await A().renderRemovals('#inboxBody',true);else if(k==='ev'){const s=streaks();await A().renderAudit('#inboxBody');if(s.length)$('#inboxBody').insertAdjacentHTML('afterbegin',`<div class="line"><b>Внимание: прогулы подряд</b>${s.map(x=>`<div class="sub dangerText">${esc(x.name)}: ${x.n} подряд</div>`).join('')}</div>`)}else if(k==='me')await meTab();else await mine()}catch(e){C.fail(e)}};
    m.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{m.querySelectorAll('[data-it]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});load(b.dataset.it)});
    const close=()=>{m.remove();if(changed)window.Ordo.Main.render()};
    m.querySelector('#inClose').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});
    m.addEventListener('click',e=>{const b=e.target.closest('[data-dec]');if(!b)return;const [id,ok]=b.dataset.dec.split('|');run(async()=>{const x=await db.rpc('decide_person_removal',{p_request_id:id,p_approve:ok==='1'});if(x.error)throw x.error;changed=true;await refreshPending();await window.Ordo.State.loadGroup();await load(cur);toast('Готово')})});
    load(cur)}
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#nickBtn'))open()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshPending();refreshNotices()}});
  setInterval(()=>{refreshPending();refreshNotices()},60000);
  window.Ordo.Inbox={syncDot,refreshPending,open};
})();
;(() => {
  const f=n=>String(n).padStart(2,'0');
  setInterval(()=>{const el=document.getElementById('dutyTimer');if(!el)return;const t=Date.parse(el.dataset.since);if(isNaN(t)){el.textContent='';return}const s=Math.max(0,Math.floor((Date.now()-t)/1000)),h=Math.floor(s/3600);el.textContent=(h?h+':':'')+f(Math.floor(s%3600/60))+':'+f(s%60)},1000);
  document.addEventListener('pointerdown',e=>{window.__lastBtn=e.target.closest&&e.target.closest('button.btn')},true);
  document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-goto-me]');if(!t)return;const A=window.Ordo.Core.app;if(!A.people.some(p=>p.user_id===A.user.id))return;A.view='queue';window.Ordo.Main.render();requestAnimationFrame(()=>{const m=document.querySelector('.qitem.me');if(m)m.scrollIntoView({behavior:'smooth',block:'center'})})});
})();
</script>
